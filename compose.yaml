name: docker

services:
  db:
    image: mysql:8.0
    container_name: educode_db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --max_connections=200
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educode_network

  redis:
    image: redis:7-alpine
    container_name: educode_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educode_network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: educode_web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-production}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      MYSQL_USER: ${MYSQL_USER:-educode}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-educode}:${MYSQL_APP_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4

      EXECUTOR_TMP_DIR: /tmp/executor
      EXECUTOR_MAX_MEMORY_MB: 256
      EXECUTOR_DEFAULT_TIMEOUT: 2.0
      EXECUTOR_MAX_STDOUT: 10000
      EXECUTOR_MAX_STDERR: 4000
      USE_DOCKER: "false"

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-20}
      REDIS_URL: redis://redis:6379/0
      AGENT_HOST_URL: http://agent_host:8100
      USE_AGENT_HOST_PROXY: ${USE_AGENT_HOST_PROXY:-true}

      MAX_CONTENT_LENGTH: 16777216
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - executor_tmp:/tmp/executor
      - kb_data:/app/data/knowledge_base
    ports:
      - "${WEB_PORT:-9900}:9900"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - educode_network
    env_file:
      - .env

  agent_host:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent_host
    container_name: educode_agent_host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_USER: ${MYSQL_USER:-educode}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      FLASK_BASE_URL: http://web:9900
      AGENT_HOST_PORT: 8100
      MCP_INTERNAL_SERVICE_TOKEN: ${MCP_INTERNAL_SERVICE_TOKEN:-dev-token}
      DEBUG: ${DEBUG:-False}
    ports:
      - "${AGENT_HOST_PORT:-8100}:8100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - educode_network
    env_file:
      - .env

  mcp_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent_host
    container_name: educode_mcp_server
    restart: unless-stopped
    entrypoint: ["python", "-m", "mcp_server", "--transport", "sse", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      TZ: Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-educode}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-educode}:${MYSQL_APP_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${MCP_PORT:-8200}:8200"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - kb_data:/app/data/knowledge_base
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',8200)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - educode_network
    env_file:
      - .env

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  executor_tmp:
    driver: local
  kb_data:
    driver: local

networks:
  educode_network:
    driver: bridge
