<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — CodeRunner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="auth-wrapper">
  <!-- Left: Brand Panel -->
  <div class="auth-brand">
    <div class="auth-brand-content">
      <div class="auth-brand-logo">
        <i class="bi bi-code-slash"></i>
      </div>
      <h1>CodeRunner</h1>
      <p>Join a community of learners and educators. Write code, solve challenges, and track your progress.</p>
      <div class="auth-brand-code">
        <span class="code-comment">// Start your journey</span><br>
        <span class="code-keyword">class</span> <span class="code-func">Student</span>:<br>
        &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-keyword">def</span> <span class="code-func">__init__</span>(self):<br>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;self.skills = [<span class="code-string">"growing"</span>]
      </div>
    </div>
  </div>

  <!-- Right: Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-container">
      <h2>Create account</h2>
      <p class="auth-subtitle">Get started with your free account</p>

      <div class="auth-input-group">
        <input id="reg-username" class="auth-input" type="text" placeholder="Username" autocomplete="username">
        <i class="bi bi-person input-icon"></i>
      </div>

      <div class="auth-input-group">
        <input id="reg-email" class="auth-input" type="email" placeholder="Email (optional)" autocomplete="email">
        <i class="bi bi-envelope input-icon"></i>
      </div>

      <div class="auth-input-group">
        <input id="reg-password" class="auth-input" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password">
        <i class="bi bi-lock input-icon"></i>
      </div>

      <div class="auth-input-group">
        <select id="reg-role" class="auth-select">
          <option value="student">I'm a Student</option>
          <option value="teacher">I'm a Teacher</option>
        </select>
        <i class="bi bi-mortarboard input-icon"></i>
      </div>

      <button id="btn-register" class="auth-btn">Create account</button>

      <div id="reg-msg" class="auth-msg"></div>

      <div class="auth-switch">
        Already have an account? <a href="{{ url_for('web_auth.login_page') }}">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="next-path-json">{{ next_path|tojson }}</script>

<script type="module">
  import { saveToken } from "/static/js/auth.js";
  const API = "/api/v1";

  const nextPath = (() => {
    try {
      const el = document.getElementById('next-path-json');
      return el ? JSON.parse(el.textContent) : null;
    } catch { return null; }
  })();

  const $ = (id) => document.getElementById(id);

  async function registerUser(e) {
    e?.preventDefault?.();
    const body = {
      username: $('reg-username').value.trim(),
      email: $('reg-email').value.trim() || undefined,
      password: $('reg-password').value,
      role: $('reg-role').value
    };
    const msg = $('reg-msg');
    msg.classList.remove('text-danger', 'text-success');
    msg.style.color = '';
    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        msg.style.color = '#16a34a';
        msg.textContent = 'Account created! Redirecting to sign in...';
        setTimeout(() => {
          window.location.assign('{{ url_for("web_auth.login_page") }}');
        }, 1500);
      } else {
        msg.style.color = '#dc2626';
        msg.textContent = data.message || 'Registration failed';
      }
    } catch (err) {
      msg.style.color = '#dc2626';
      msg.textContent = 'Network error';
      console.error(err);
    }
  }

  $('btn-register')?.addEventListener('click', registerUser);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') registerUser(e);
  });
</script>

</body>
</html>
