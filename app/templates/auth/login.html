<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — CodeRunner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="auth-wrapper">
  <!-- Left: Brand Panel -->
  <div class="auth-brand">
    <div class="auth-brand-content">
      <div class="auth-brand-logo">
        <i class="bi bi-code-slash"></i>
      </div>
      <h1>CodeRunner</h1>
      <p>Practice coding, take quizzes, and sharpen your programming skills in a collaborative classroom environment.</p>
      <div class="auth-brand-code">
        <span class="code-comment">// Ready to code?</span><br>
        <span class="code-keyword">def</span> <span class="code-func">solve</span>(problem):<br>
        &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-keyword">return</span> <span class="code-string">"Accepted"</span>
      </div>
    </div>
  </div>

  <!-- Right: Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-container">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Sign in to continue your coding journey</p>

      <div class="auth-input-group">
        <input id="login-username" class="auth-input" type="text" placeholder="Username or email" autocomplete="username">
        <i class="bi bi-person input-icon"></i>
      </div>

      <div class="auth-input-group">
        <input id="login-password" class="auth-input" type="password" placeholder="Password" autocomplete="current-password">
        <i class="bi bi-lock input-icon"></i>
      </div>

      <button id="btn-login" class="auth-btn">Sign in</button>

      <div id="login-msg" class="auth-msg text-danger"></div>

      <div class="auth-switch">
        Don't have an account? <a href="{{ url_for('web_auth.signup_page') }}">Sign up</a>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="next-path-json">{{ next_path|tojson }}</script>

<script type="module">
  import { saveToken } from "/static/js/auth.js";
  const API = "/api/v1";

  const nextPath = (() => {
    try {
      const el = document.getElementById('next-path-json');
      return el ? JSON.parse(el.textContent) : null;
    } catch { return null; }
  })();

  const $ = (id) => document.getElementById(id);

  async function login(e) {
    e?.preventDefault?.();
    const body = {
      username: $('login-username').value.trim(),
      password: $('login-password').value
    };
    const msg = $('login-msg');
    msg.textContent = '';
    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.token) {
        saveToken(data.token);
        window.location.assign(nextPath || '/');
      } else {
        msg.textContent = data.message || 'Login failed';
      }
    } catch (err) {
      msg.textContent = 'Network error';
      console.error(err);
    }
  }

  $('btn-login')?.addEventListener('click', login);
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(e); });
</script>

</body>
</html>
