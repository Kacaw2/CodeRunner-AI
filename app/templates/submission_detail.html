<!-- app/templates/submission_detail.html -->
{% extends "base.html" %}
{% set page = 'submissions' %}
{% block title %}Submission Detail{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/darcula.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/question_runner.css') }}">

<style>
.CodeMirror { 
    height: 400px; 
    border-radius: 8px;
}

.submission-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 56px);
    width: 100%;
    background: #f8fafc;
    overflow: hidden;
    padding: 10px;
    gap: 10px;
}

.submission-content {
    display: flex;
    flex-direction: column;
    flex: 1;
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.submission-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem;
    background: #f8fafc;
    border-bottom: 2px solid #e2e8f0;
    flex-shrink: 0;
}

.submission-info {
    flex: 1;
}

.submission-title {
    font-size: 1.75rem;
    font-weight: 700;
    color: #1e293b;
    margin: 0 0 0.75rem 0;
}

.submission-meta {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
}

.submission-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
}

.code-section {
    margin-bottom: 2rem;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.125rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid #e2e8f0;
}
</style>
{% endblock %}

{% block content %}
<div class="submission-container">
    <div class="submission-content">
        <!-- Navigation -->
        <div class="nav-buttons">
            <a href="/submissions" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to List
            </a>
        </div>

        <!-- Loading placeholder -->
        <div id="submissionDetail" style="flex: 1; overflow-y: auto;">
            <p class="text-center text-muted" style="padding: 3rem;">Loading...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/clike/clike.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/python/python.js"></script>
<script type="module" src="{{ url_for('static', filename='js/submission_detail.js') }}"></script>
{% endblock %}
