<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Coding Practice Platform{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css" rel="stylesheet" />
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">

</head>

<body data-page="{{ page_class |default('') }}">

    {% include "_navbar.html" %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
        window.API_BASE = window.API_BASE || "";
    </script>
    <!-- <script src="{{ url_for('static', filename='js/app.js') }}"></script> -->

    <script>
        (function() {
            const token = localStorage.getItem('token');
            if (token) {
                // stop all fetch 
                const originalFetch = window.fetch;
                window.fetch = function(url, options = {}) {
                    options.headers = options.headers || {};
                    if (!options.headers['Authorization'] && token) {
                        options.headers['Authorization'] = `Bearer ${token}`;
                    }
                    return originalFetch(url, options);
                };
                

            }
        })();
        const defaultHeaders = {
            "Content-Type": "application/json",
        };

        /**
         * Lightweight wrapper around fetch for JSON APIs.
         */
        async function API(path, options = {}) {
            const { method = "GET", body, headers = {}, skipAuth = false } = options;
            const requestHeaders = { ...defaultHeaders, ...headers };
            const token = localStorage.getItem("token");

            if (!skipAuth && token) {
                requestHeaders.Authorization = `Bearer ${token}`;
            }

            const fetchOptions = {
                method,
                headers: requestHeaders,
            };

            if (body !== undefined) {
                fetchOptions.body = JSON.stringify(body);
            }

            const base = window.API_BASE ?? "";
            const url = path.startsWith("http") ? path : `${base}${path}`;

            const response = await fetch(url, fetchOptions);
            const data = await response.json().catch(() => null);

            if (!response.ok) {
                const message =
                    (data && (data.message || data.error)) ||
                    `Request failed with status ${response.status}`;
                throw new Error(message);
            }

            return data;
        }

    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
