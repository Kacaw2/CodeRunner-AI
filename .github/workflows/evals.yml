name: evals

# Agent quality / regression gate. UNLIKE tests.yml this needs a real LLM
# (DEEPSEEK_API_KEY) and spends tokens, so it is NOT a per-PR required check.
# It runs nightly and on manual dispatch in DB-backed harness mode: it drives the
# EvalHarness over the dataset, persists trace/eval rows to a throwaway SQLite DB,
# and gates on a full ReportGenerator report (regressions + baseline floor from
# evals/baseline.json). Calibrate the floor with the "update baseline" dispatch
# (python -m ai.evals.ci --use-harness --bootstrap-schema --update-baseline).

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Rewrite baseline.json from this run instead of gating"
        type: boolean
        default: false
      tolerance:
        description: "Allowed pp drop below baseline before failing (e.g. 0.05)"
        type: string
        default: "0.05"
  schedule:
    # 02:00 UTC daily.
    - cron: "0 2 * * *"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-not-used-in-prod
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-chat' }}
      # Harness mode persists trace/eval rows. CI has no MySQL service, so it runs
      # against a throwaway SQLite file whose schema is bootstrapped per run
      # (--bootstrap-schema). DB_URL keeps the core session pointed at the same DB.
      DB_URL: sqlite:///eval_ci.db
      DATABASE_URL: sqlite:///eval_ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — require API key
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not set; cannot run evals."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # DB-backed harness gate: runs the EvalHarness over the dataset, persists
      # trace/eval rows, then gates on a full ReportGenerator report (regressions
      # + baseline floor). Emits eval-report.json/.md and eval-regressions.json.
      - name: Run evals (gate)
        if: ${{ github.event_name == 'schedule' || inputs.update_baseline != true }}
        run: |
          python -m ai.evals.ci --use-harness --bootstrap-schema \
            --db-url "${DB_URL}" --selector all \
            --tolerance "${{ inputs.tolerance || '0.05' }}" \
            --report-out eval-report.json

      - name: Run evals (update baseline)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline == true }}
        run: |
          python -m ai.evals.ci --use-harness --bootstrap-schema \
            --db-url "${DB_URL}" --selector all \
            --update-baseline --report-out eval-report.json

      - name: Upload eval report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-report.json
            eval-report.md
            eval-regressions.json
          if-no-files-found: ignore
